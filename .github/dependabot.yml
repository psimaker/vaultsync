version: 2
updates:
  # The Go modules that build together: go/ (the iOS bridge, decision 045) and
  # desktop/ (the desktop agent, #175) link hub/ through
  # `replace github.com/psimaker/vaultsync/hub => ../hub`, so a dependency of
  # hub — filippo.io/edwards25519 for SPAKE2 today — must move in all three at
  # once: a bump in /hub alone leaves go/ and desktop/ with a go.mod that needs
  # updating, and Go Tests and Desktop Tests fail (#220). group-by makes ONE
  # pull request per dependency across the three directories (a dependency
  # only one of them uses still touches only that one).
  # The patched Syncthing and go-stun forks in go/ are local replace-shadowed
  # copies pinned to a 2.x pseudo-version, so Dependabot can't reason about
  # them — ignored; they are tracked manually against upstream security
  # advisories (see go/patches/README.md).
  # Minor/patch bumps are auto-merged (dependabot-auto-merge.yml) once Go Tests,
  # Hub Tests, Desktop Tests and the govulncheck gates pass; a merged go/ bump
  # still needs an xcframework rebuild before the next archive.
  - package-ecosystem: gomod
    directories: ["/go", "/hub", "/desktop"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Let a freshly-cut release settle before filing a PR, so we skip the churn
    # of x.y.0 -> x.y.1 same-week re-bumps.
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: github.com/syncthing/syncthing
      - dependency-name: github.com/ccding/go-stun
    groups:
      linked-modules:
        patterns: ["*"]
        group-by: dependency-name

  # GitHub Actions across all workflows. Grouped into ONE weekly PR, split so the
  # auto-merge workflow (.github/workflows/dependabot-auto-merge.yml) can act on
  # minor/patch only — those are the bumps actually exercised by the PR's
  # required checks (ci.yml + security.yml run on pull_request). Majors land in a
  # separate PR for manual review, because actions used only in docker.yml /
  # version-check.yml are NOT run on pull_request, so a green PR proves nothing
  # about them. Also migrates mutable tags to commit SHAs once you pin them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
    # GitHub Actions does not support the semver-specific cooldown keys. Let
    # every action tag age for three days; major updates still stay in their
    # separate manual-review group above.
    cooldown:
      default-days: 3

  # notify relay container base image (golang:1.26-alpine).
  # Dependabot will also propose @sha256 digest pins for these.
  # NOT auto-merged: docker.yml (build + multi-arch + Trivy scan) runs only on
  # push/tag, never on pull_request, so a base-image bump PR is never actually
  # built or scanned. Review by building/scanning locally first.
  - package-ecosystem: docker
    directory: /notify
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # The Go toolchain version is a repo-wide decision (go.mod in go/, notify/
    # and hub/ declare the exact version; CI and the xcframework build follow
    # it). A builder-image minor bump on its own would desynchronise that, so
    # Dependabot only proposes patch/digest updates here.
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Hub coordinator container base image — same policy as notify.
  - package-ecosystem: docker
    directory: /hub
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Notify dependencies. The glob module and calmh replacement must stay byte-
  # aligned with the bundled Syncthing ignore matcher, so that pair is reviewed
  # only when the Syncthing pin changes. Future independent modules remain
  # visible to Dependabot.
  - package-ecosystem: gomod
    directory: /notify
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: github.com/gobwas/glob
      - dependency-name: github.com/calmh/glob
