name: Desktop Release

# Builds the `vaultsync` desktop agent and the `vaultsync-tray` menu-bar app
# (desktop/).
#   pull_request  → cross-builds every release target (proves they compile),
#                   publishes nothing
#   desktop-v* tag → a GitHub release with vaultsync_<os>_<arch> and
#                   vaultsync-tray_<os>_<arch> binaries and one SHA256SUMS —
#                   the asset names setup.sh downloads.
#
# The agent is pure Go and cross-compiled on Linux for every target, exactly
# as before. The tray is pure Go on Linux too (StatusNotifierItem over
# DBus), but on macOS it is Cocoa through cgo, so its two macOS binaries are
# built on a macOS runner (decision 048). The sums are made in the release
# job over everything.
#
# macOS and Linux only for now; Windows follows its own service model (#175).

on:
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "hub/**"
      - ".github/workflows/desktop-release.yml"
  push:
    tags:
      - "desktop-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # No build cache on a tag: what ships in a release is built from the
      # module cache alone, never from a cache another run could have
      # written to.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache: ${{ github.ref_type != 'tag' }}
          cache-dependency-path: desktop/go.sum

      # Asset names are a contract with setup.sh: vaultsync_<goos>_<goarch>.
      # The tray's Linux binaries follow the same shape.
      - name: Build binaries
        working-directory: desktop
        env:
          CGO_ENABLED: "0"
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#desktop-v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            goos="${target%/*}"; goarch="${target#*/}"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -buildvcs=false \
              -ldflags="-s -w -X main.version=${version}" -o "dist/vaultsync_${goos}_${goarch}" .
          done
          for target in linux/amd64 linux/arm64; do
            goos="${target%/*}"; goarch="${target#*/}"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -buildvcs=false \
              -ldflags="-s -w -X main.version=${version}" -o "dist/vaultsync-tray_${goos}_${goarch}" ./cmd/vaultsync-tray
          done
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vaultsync-desktop-binaries
          path: desktop/dist/
          retention-days: 7
          if-no-files-found: error

  build-tray-macos:
    name: Build tray (macOS)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # No build cache on a tag: what ships in a release is built from the
      # module cache alone, never from a cache another run could have
      # written to.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache: ${{ github.ref_type != 'tag' }}
          cache-dependency-path: desktop/go.sum

      # Cocoa through cgo: both architectures from the one runner (clang
      # takes -arch from Go). Unsigned until #222 puts the certificate in.
      - name: Build the tray
        working-directory: desktop
        env:
          CGO_ENABLED: "1"
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#desktop-v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          for goarch in arm64 amd64; do
            GOOS=darwin GOARCH="$goarch" go build -trimpath -buildvcs=false \
              -ldflags="-s -w -X main.version=${version}" -o "dist/vaultsync-tray_darwin_${goarch}" ./cmd/vaultsync-tray
          done
          file dist/*
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vaultsync-desktop-tray-macos
          path: desktop/dist/
          retention-days: 7
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [build, build-tray-macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vaultsync-desktop-binaries
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vaultsync-desktop-tray-macos
          path: dist

      # One SHA256SUMS over the agent and the tray: setup.sh takes exactly
      # the one line whose name is the asset it downloads (an awk filter),
      # so the tray's lines are passed over.
      - name: Sum the assets
        working-directory: dist
        run: |
          sha256sum vaultsync_* vaultsync-tray_* > SHA256SUMS
          cat SHA256SUMS

      # --latest=false: "Latest" on the repository is the iOS app's release.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false \
            --title "VaultSync for Mac and Linux ${GITHUB_REF_NAME#desktop-v}" \
            --notes "The desktop agent \`vaultsync\` for macOS and Linux: it installs its own pinned Syncthing, pairs with your VaultSync Hub by code and keeps your Obsidian vaults in sync. \`vaultsync-tray\` is the menu-bar icon for it. Check downloads against SHA256SUMS. On a Mac, download with curl — the binaries are not notarized yet, so a browser download is blocked. Setup: docs/hub.md." \
            dist/*
