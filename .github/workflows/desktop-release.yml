name: Desktop Release

# Builds the `vaultsync` desktop agent and the `vaultsync-tray` menu-bar app
# (desktop/).
#   pull_request   → cross-builds every release target, assembles
#                    VaultSync.app and signs it ad hoc with the release's own
#                    script and checks (proves all of it works), publishes
#                    nothing
#   desktop-v* tag → signs the macOS binaries and VaultSync.app with the
#                    Developer ID, notarizes them and makes a GitHub release
#                    with vaultsync_<os>_<arch>, vaultsync-tray_linux_<arch>,
#                    VaultSync_darwin_<arch>.zip and one SHA256SUMS —
#                    vaultsync_<os>_<arch> is the asset setup.sh downloads.
#                    desktop-vX.Y.Z-<suffix> makes a draft release: a test
#                    run of the signing that nobody downloads.
#
# The agent is pure Go and cross-compiled on Linux for every target. The tray
# is pure Go on Linux too (StatusNotifierItem over DBus), but on macOS it is
# Cocoa through cgo, so it is built on a macOS runner (decision 048), which
# also puts VaultSync.app together around it and the agent. Signing and
# notarization run desktop/macos/sign.sh with rcodesign on Linux; only the
# tag's job sees the signing secrets (environment desktop-signing, desktop-v*
# tags only). desktop/macos/verify.sh then checks the result on a Mac with
# Apple's own tools before anything is published (decision 052).
#
# macOS and Linux only for now; Windows follows its own service model (#175).

on:
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "hub/**"
      - ".github/workflows/desktop-release.yml"
  push:
    tags:
      - "desktop-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

# bash -eo pipefail: a failing command in a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # desktop-vX.Y.Z is what setup.sh installs, desktop-vX.Y.Z-<suffix> a
      # draft. Any other tag would be signed and published as a release
      # nothing installs, with 0.0.0 as VaultSync.app's version.
      - name: Check the tag
        if: github.ref_type == 'tag'
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::${GITHUB_REF_NAME} is neither desktop-vX.Y.Z nor desktop-vX.Y.Z-<suffix>"
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # No build cache on a tag: what ships in a release is built from the
      # module cache alone, never from a cache another run could have
      # written to.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache: ${{ github.ref_type != 'tag' }}
          cache-dependency-path: desktop/go.sum

      # Asset names are a contract with setup.sh: vaultsync_<goos>_<goarch>.
      # The tray's Linux binaries follow the same shape.
      - name: Build binaries
        working-directory: desktop
        env:
          CGO_ENABLED: "0"
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#desktop-v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            goos="${target%/*}"; goarch="${target#*/}"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -buildvcs=false \
              -ldflags="-s -w -X main.version=${version}" -o "dist/vaultsync_${goos}_${goarch}" .
          done
          for target in linux/amd64 linux/arm64; do
            goos="${target%/*}"; goarch="${target#*/}"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -buildvcs=false \
              -ldflags="-s -w -X main.version=${version}" -o "dist/vaultsync-tray_${goos}_${goarch}" ./cmd/vaultsync-tray
          done
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vaultsync-desktop-binaries
          path: desktop/dist/
          retention-days: 7
          if-no-files-found: error

  build-macos:
    name: Build app (macOS)
    needs: build
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # No build cache on a tag: what ships in a release is built from the
      # module cache alone, never from a cache another run could have
      # written to.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache: ${{ github.ref_type != 'tag' }}
          cache-dependency-path: desktop/go.sum

      # The agent goes into the bundle exactly as the build job made it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vaultsync-desktop-binaries
          path: agent

      # Cocoa through cgo: both architectures from the one runner (clang
      # takes -arch from Go). Without a minimum, clang targets the runner's
      # own macOS and the tray would refuse to start on anything older; the
      # minimum goes in through the cgo flags, which are part of Go's build
      # cache key (MACOSX_DEPLOYMENT_TARGET is not). It must match the
      # agent's and LSMinimumSystemVersion in desktop/macos/Info.plist.
      - name: Build the tray and put VaultSync.app together
        working-directory: desktop
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-O2 -g -mmacosx-version-min=12.0"
          CGO_LDFLAGS: "-mmacosx-version-min=12.0"
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#desktop-v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          want=$(plutil -extract LSMinimumSystemVersion raw macos/Info.plist)
          mkdir -p dist
          for goarch in arm64 amd64; do
            GOOS=darwin GOARCH="$goarch" go build -trimpath -buildvcs=false \
              -ldflags="-s -w -X main.version=${version}" -o "dist/vaultsync-tray_darwin_${goarch}" ./cmd/vaultsync-tray
            mkdir "dist/${goarch}"
            macos/make-app.sh "$version" "../agent/vaultsync_darwin_${goarch}" "dist/vaultsync-tray_darwin_${goarch}" "dist/${goarch}"
            for bin in "dist/${goarch}/VaultSync.app/Contents/MacOS/"*; do
              minos=$(vtool -show-build "$bin" | awk '$1 == "minos" { print $2 }')
              if [ "$minos" != "$want" ]; then
                echo "::error::${bin} needs macOS ${minos}, Info.plist says ${want}"
                exit 1
              fi
            done
          done
          file dist/*/VaultSync.app/Contents/MacOS/*

      # upload-artifact drops file modes, so each bundle travels as a tar;
      # COPYFILE_DISABLE and --no-mac-metadata keep macOS from adding ._
      # files for extended attributes, which would land inside the bundle
      # when sign.sh unpacks it.
      - name: Pack the bundles
        working-directory: desktop/dist
        env:
          COPYFILE_DISABLE: "1"
        run: |
          for goarch in arm64 amd64; do
            tar --no-mac-metadata -C "$goarch" -cf "VaultSync_darwin_${goarch}.app.tar" VaultSync.app
          done
          ls -l

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vaultsync-desktop-macos
          path: desktop/dist/VaultSync_darwin_*.app.tar
          retention-days: 7
          if-no-files-found: error

  # A pull request signs with the same script, ad hoc: every change to the
  # signing path runs here before it ever meets a tag.
  sign-check:
    name: Sign ad hoc (macOS)
    needs: [build, build-macos]
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          sparse-checkout: desktop/macos

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vaultsync-desktop-binaries
          path: plain

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vaultsync-desktop-macos
          path: macos

      - name: Install rcodesign
        run: |
          desktop/macos/install-rcodesign.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Sign
        run: desktop/macos/sign.sh plain macos signed

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vaultsync-desktop-signed
          path: signed/
          retention-days: 7
          if-no-files-found: error

  sign:
    name: Sign and notarize (macOS)
    needs: [build, build-macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The environment holds the Developer ID certificate and the App Store
    # Connect key and lets only desktop-v* tags use them. The secrets exist
    # as files only between the step that writes them and the step that
    # removes them, whatever happens in between.
    environment: desktop-signing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          sparse-checkout: desktop/macos

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vaultsync-desktop-binaries
          path: plain

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vaultsync-desktop-macos
          path: macos

      - name: Install rcodesign
        run: |
          desktop/macos/install-rcodesign.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # rcodesign reads only the legacy PKCS#12 format (SHA-1 MAC, 3DES):
      # a Keychain Access export or `openssl pkcs12 -export -legacy`.
      - name: Write the signing material
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          umask 077
          keys="$RUNNER_TEMP/keys"
          mkdir "$keys"
          printf '%s' "$P12" | base64 -d > "$keys/developer-id.p12"
          printf '%s' "$P12_PASSWORD" > "$keys/developer-id.password"
          printf '%s\n' "$API_KEY_P8" > "$keys/api-key.p8"
          rcodesign encode-app-store-connect-api-key -o "$keys/api-key.json" \
            "$API_ISSUER_ID" "$API_KEY_ID" "$keys/api-key.p8"
          rm "$keys/api-key.p8"

      - name: Sign, notarize and staple
        env:
          VAULTSYNC_SIGN_P12: ${{ runner.temp }}/keys/developer-id.p12
          VAULTSYNC_SIGN_P12_PASSWORD_FILE: ${{ runner.temp }}/keys/developer-id.password
          VAULTSYNC_NOTARY_KEY: ${{ runner.temp }}/keys/api-key.json
        run: desktop/macos/sign.sh plain macos signed

      - name: Remove the signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vaultsync-desktop-signed
          path: signed/
          retention-days: 7
          if-no-files-found: error

  verify:
    name: Check signatures (macOS)
    needs: [sign-check, sign]
    if: ${{ !cancelled() && (needs.sign.result == 'success' || needs.sign-check.result == 'success') }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          sparse-checkout: desktop/macos

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vaultsync-desktop-signed
          path: signed

      # On a tag the team is pinned: a certificate from another team would
      # pass every other check and reset every user's granted permissions.
      # The repository variable MACOS_TEAM_ID holds it.
      - name: Check
        env:
          TEAM: ${{ github.ref_type == 'tag' && vars.MACOS_TEAM_ID || '' }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ -z "$TEAM" ]; then
              echo "::error::the repository variable MACOS_TEAM_ID (the Developer ID's team) is not set"
              exit 1
            fi
            desktop/macos/verify.sh signed "$TEAM"
          else
            desktop/macos/verify.sh signed
          fi

  release:
    name: GitHub release
    needs: [build, sign, verify]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vaultsync-desktop-binaries
          path: plain

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vaultsync-desktop-signed
          path: signed

      # The Linux binaries as built, the macOS ones only as signed: an
      # unsigned macOS build never reaches a release.
      - name: Collect the assets
        run: |
          mkdir dist
          cp plain/vaultsync_linux_* plain/vaultsync-tray_linux_* dist/
          cp signed/vaultsync_darwin_* signed/VaultSync_darwin_*.zip dist/
          have=$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort | tr '\n' ' ')
          want="VaultSync_darwin_amd64.zip VaultSync_darwin_arm64.zip vaultsync-tray_linux_amd64 vaultsync-tray_linux_arm64 vaultsync_darwin_amd64 vaultsync_darwin_arm64 vaultsync_linux_amd64 vaultsync_linux_arm64 "
          if [ "$have" != "$want" ]; then
            echo "::error::assets are: ${have}"; exit 1
          fi

      # One SHA256SUMS over everything: setup.sh takes exactly the one line
      # whose name is the asset it downloads (an awk filter), so the other
      # lines are passed over.
      - name: Sum the assets
        working-directory: dist
        run: |
          sha256sum vaultsync_* vaultsync-tray_* VaultSync_* > SHA256SUMS
          cat SHA256SUMS

      # --latest=false: "Latest" on the repository is the iOS app's release.
      # A tag with a suffix is a test run of the signing: a draft, which
      # setup.sh never sees.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=()
          case "${GITHUB_REF_NAME#desktop-v}" in
            *-*) draft=(--draft --prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false "${draft[@]}" \
            --title "VaultSync for Mac and Linux ${GITHUB_REF_NAME#desktop-v}" \
            --notes "The desktop agent \`vaultsync\` for macOS and Linux: it installs its own pinned Syncthing, pairs with your VaultSync Hub by code and keeps your Obsidian vaults in sync. Set it up with the setup link (docs/hub.md); it downloads \`vaultsync_<os>_<arch>\` for you. The menu-bar icon comes on top: on a Mac \`VaultSync_darwin_<arch>.zip\` (VaultSync.app), on Linux \`vaultsync-tray_linux_<arch>\`. Everything for macOS is signed with a Developer ID and notarized by Apple. Check downloads against SHA256SUMS." \
            dist/*
